# Air quality companion for the Waveshare ESP32-C6-LCD-1.47: an animated character whose
# mood follows the air quality reported by Home Assistant sensors (CO2, PM2.5, temperature,
# humidity). The sky behind it follows the sun (Home Assistant sun.sun): day, dusk, night
# with the moon and stars, plus the current weather. Adjust the substitutions below to your own entities and language.

substitutions:
  # Home Assistant entities to display (defaults: IKEA ALPSTUGA with a French HA setup).
  co2_entity: sensor.alpstuga_air_quality_monitor_dioxyde_de_carbone
  pm25_entity: sensor.alpstuga_air_quality_monitor_pm2_5
  temp_entity: sensor.alpstuga_air_quality_monitor_temperature
  hum_entity: sensor.alpstuga_air_quality_monitor_humidite
  # Weather entity drawn in the sky (clouds, rain, snow, storm, fog, wind).
  weather_entity: weather.maison
  # Test only: forces a weather condition (e.g. "rainy") instead of the entity state.
  # Flash with: uvx esphome -s weather_override rainy run compagnon.yaml --device OTA
  weather_override: ""
  # CO2 thresholds in ppm: average from co2_warn, bad from co2_bad. Once bad, the character
  # stays bad until the CO2 goes back under co2_warn (time to air the room properly).
  co2_warn: "1500"
  co2_bad: "2500"
  # 4MB works on every unit; set 8MB if esptool reports an ESP32-C6FH8.
  flash_size: 4MB
  # On-screen and Home Assistant texts.
  msg_ok: "Tout va bien"
  msg_meh: "L'air s'alourdit"
  msg_bad: "Aère vite !"
  msg_wait: "J'attends HA..."
  label_temp: "Temp."
  label_hum: "Humidité"
  name_screen_brightness: "Luminosité écran"

esphome:
  name: compagnon
  friendly_name: Compagnon
  on_boot:
    priority: -100
    then:
      - lambda: id(apply_screen_brightness)->execute();

esp32:
  variant: esp32c6
  flash_size: ${flash_size}
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Bare block: OTA uploads are encrypted with the API key above.
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Compagnon Fallback

captive_portal:

globals:
  # Animation clock, advanced by the interval below before each redraw so that
  # every slice of a partial-buffer redraw sees the same frame.
  - id: frame
    type: uint32_t
    initial_value: "0"
  # Current mood (-1 no data, 0 good, 1 average, 2 bad), set by the display lambda.
  - id: mood_now
    type: int
    initial_value: "-1"
  # Breathing speed of the character (rad/s), shared with the LED.
  - id: breath_speed
    type: float
    initial_value: "1.0"
  # Weather drawn in the sky, decoded from the weather entity state.
  - id: w_clouds  # 0 (clear) to 5 (overcast)
    type: int
    initial_value: "0"
  - id: w_rain  # 0 none, 1 rain, 2 heavy rain or hail
    type: int
    initial_value: "0"
  - id: w_snow
    type: bool
    initial_value: "false"
  - id: w_storm
    type: bool
    initial_value: "false"
  - id: w_fog
    type: bool
    initial_value: "false"
  - id: w_wind
    type: bool
    initial_value: "false"
  # Current view (0 character, 1 big values) and the frame it was entered at.
  - id: view
    type: int
    initial_value: "0"
  - id: view_since
    type: uint32_t
    initial_value: "0"

# BOOT button (GPIO9): a short press toggles between the character and the big values.
# It is only a strapping pin at reset: holding it while powering up enters download mode.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO9
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    on_click:
      min_length: 30ms
      max_length: 800ms
      then:
        - lambda: |-
            id(view) = id(view) == 0 ? 1 : 0;
            id(view_since) = id(frame);

# The backlight is an internal light driven by this number, not a Home Assistant light:
# area-wide "turn off the lights" actions must not switch the screen off.
number:
  - platform: template
    id: screen_brightness
    name: ${name_screen_brightness}
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 80
    on_value:
      - script.execute: apply_screen_brightness

script:
  - id: apply_screen_brightness
    then:
      - lambda: |-
          const float v = id(screen_brightness).state;
          if (std::isnan(v) || v <= 0) {
            id(backlight).turn_off().perform();
          } else {
            id(backlight).turn_on().set_brightness(v / 100.0f).perform();
          }

text_sensor:
  - platform: homeassistant
    id: weather_state
    entity_id: ${weather_entity}
    on_value:
      - lambda: |-
          // Home Assistant weather conditions: https://www.home-assistant.io/integrations/weather/
          const std::string forced = "${weather_override}";
          const std::string &w = forced.empty() ? x : forced;
          int clouds = 0, rain = 0;
          bool snow = false, storm = false, fog = false, wind = false;
          if (w == "partlycloudy") clouds = 2;
          else if (w == "cloudy") clouds = 4;
          else if (w == "fog") { clouds = 2; fog = true; }
          else if (w == "rainy") { clouds = 4; rain = 1; }
          else if (w == "pouring") { clouds = 5; rain = 2; }
          else if (w == "hail") { clouds = 5; rain = 2; }
          else if (w == "snowy") { clouds = 4; snow = true; }
          else if (w == "snowy-rainy") { clouds = 4; rain = 1; snow = true; }
          else if (w == "lightning") { clouds = 5; storm = true; }
          else if (w == "lightning-rainy") { clouds = 5; rain = 2; storm = true; }
          else if (w == "windy") wind = true;
          else if (w == "windy-variant") { clouds = 3; wind = true; }
          id(w_clouds) = clouds;
          id(w_rain) = rain;
          id(w_snow) = snow;
          id(w_storm) = storm;
          id(w_fog) = fog;
          id(w_wind) = wind;

sensor:
  - platform: homeassistant
    id: co2
    entity_id: ${co2_entity}
  - platform: homeassistant
    id: pm25
    entity_id: ${pm25_entity}
  - platform: homeassistant
    id: temp
    entity_id: ${temp_entity}
  - platform: homeassistant
    id: hum
    entity_id: ${hum_entity}
  - platform: homeassistant
    id: sun_elevation
    entity_id: sun.sun
    attribute: elevation
  - platform: homeassistant
    id: sun_azimuth
    entity_id: sun.sun
    attribute: azimuth

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    # Waveshare advises <= 50% backlight to avoid burn-in shadows: 100% in HA = 50% here.
    max_power: 50%

light:
  - platform: monochromatic
    id: backlight
    internal: true
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
  - platform: esp32_rmt_led_strip
    id: rgb_led
    internal: true
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 1s

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

font:
  - file: "gfonts://Nunito@800"
    id: font_value
    size: 22
    glyphsets: [GF_Latin_Core]
    glyphs: "°µ³"
  - file: "gfonts://Nunito@600"
    id: font_label
    size: 13
    glyphsets: [GF_Latin_Core]
    glyphs: "°µ³"
  - file: "gfonts://Nunito@800"
    id: font_big
    size: 44
    glyphs: "0123456789.-°%"

interval:
  - interval: 80ms
    then:
      - lambda: |-
          id(frame)++;
          // The big values view goes back to the character after 10 s.
          if (id(view) == 1 && id(frame) - id(view_since) > 125) id(view) = 0;
          id(screen).update();
          // The LED breathes with the character, in the mood color. It is written
          // directly to the strip (not through the light state) to avoid a log line
          // and a light transition per frame. Off while there is no data.
          auto *led = (light::AddressableLight *) id(rgb_led).get_output();
          const int mood = id(mood_now);
          float r = 0, g = 0, b = 0;
          if (mood == 0) { r = 0.1f; g = 1.0f; b = 0.3f; }        // good: green
          else if (mood == 1) { r = 1.0f; g = 0.6f; b = 0.0f; }   // average: amber
          else if (mood == 2) { r = 1.0f; g = 0.05f; b = 0.0f; }  // bad: red
          const float wave = 0.5f + 0.5f * sinf(id(frame) * 0.08f * id(breath_speed));
          const float level = 0.25f * (0.15f + 0.85f * wave * wave);  // max 25%, never fully dark
          (*led)[0] = Color(r * level * 255, g * level * 255, b * level * 255);
          led->schedule_show();

display:
  - platform: mipi_spi
    id: screen
    model: WAVESHARE-ESP32-C6-LCD-1.47
    update_interval: never
    buffer_size: 25%
    lambda: |-
      const uint32_t f = id(frame);
      const float t = f * 0.08f;  // seconds

      auto val = [](esphome::sensor::Sensor *s) -> float {
        return s->has_state() ? s->state : NAN;
      };
      const float c = val(id(co2));
      const float p = val(id(pm25));
      const float tc = val(id(temp));
      const float h = val(id(hum));

      // CO2 level with hysteresis, so that the mood does not flicker around a threshold:
      // bad lasts until the CO2 is back under co2_warn, average until 100 ppm under it.
      static int co2_level = 0;
      if (!std::isnan(c)) {
        if (c >= ${co2_bad}) co2_level = 2;
        else if (co2_level == 2 && c < ${co2_warn}) co2_level = 0;
        else if (co2_level == 0 && c >= ${co2_warn}) co2_level = 1;
        else if (co2_level == 1 && c < ${co2_warn} - 100) co2_level = 0;
      }

      // Mood: 0 happy, 1 meh, 2 suffocating, -1 no data yet.
      int mood = -1;
      if (!std::isnan(c) || !std::isnan(p)) {
        mood = std::isnan(c) ? 0 : co2_level;
        if (!std::isnan(p) && p >= 35) mood = 2;
        else if (!std::isnan(p) && p >= 15) mood = std::max(mood, 1);
      }
      id(mood_now) = mood;
      // Slow, calm breathing; a bit faster when the air gets bad.
      id(breath_speed) = mood == 2 ? 2.4f : (mood == 1 ? 1.5f : 1.0f);
      const bool cold = !std::isnan(tc) && tc < 18.0f;
      const bool hot = !std::isnan(tc) && tc > 26.0f;

      // Big values view, readable from across the room.
      if (id(view) == 1) {
        const Color dim(150, 145, 165);
        it.fill(Color(18, 16, 28));
        auto lvl = [](float v, float warn, float bad) -> Color {
          if (std::isnan(v) || v < warn) return Color(170, 230, 190);
          if (v < bad) return Color(245, 210, 110);
          return Color(245, 130, 120);
        };
        auto row = [&](int y, const char *label, float v, const char *fmt, Color col) {
          it.filled_rectangle(10, y + 8, 4, 62, col);
          it.print(24, y + 4, id(font_label), dim, label);
          if (std::isnan(v)) {
            it.print(24, y + 18, id(font_big), dim, "--");
          } else {
            it.printf(24, y + 18, id(font_big), col, fmt, v);
          }
        };
        const Color neutral(220, 215, 235);
        const Color warn(245, 210, 110);
        row(2, "CO2 ppm", c, "%.0f", lvl(c, ${co2_warn}, ${co2_bad}));
        row(81, "PM2.5 µg/m³", p, "%.0f", lvl(p, 15, 35));
        row(160, "${label_temp}", tc, "%.1f°", (cold || hot) ? warn : neutral);
        row(239, "${label_hum}", h, "%.0f%%", (!std::isnan(h) && (h < 30 || h > 70)) ? warn : neutral);
        return;
      }

      const Color bg(18, 16, 28);
      const Color white(245, 245, 245);
      const Color ink(30, 24, 40);
      const Color grey(150, 145, 165);
      Color body(120, 210, 160);                       // happy: mint
      if (mood == 1) body = Color(240, 200, 90);       // meh: mustard
      if (mood == 2) body = Color(235, 110, 100);      // suffocating: coral
      if (mood == -1) body = Color(140, 140, 160);     // waiting for data
      if (cold) body = Color(body.r * 0.7f, body.g * 0.8f, std::min(255.0f, body.b * 1.2f + 60));

      // ---- Sky, from the sun elevation and azimuth (degrees) ----
      const float el = val(id(sun_elevation));
      const float az = val(id(sun_azimuth));
      auto clamp01 = [](float x) { return x < 0 ? 0.0f : (x > 1 ? 1.0f : x); };
      // day: 0 at night (sun under -8°), 1 in daylight (above 8°).
      const float day = std::isnan(el) ? 0.0f : clamp01((el + 8.0f) / 16.0f);
      // dusk: peaks when the sun crosses the horizon.
      const float dusk = std::isnan(el) ? 0.0f : clamp01(1.0f - fabsf(el) / 8.0f);
      auto mix = [](Color a, Color b, float k) {
        return Color(a.r + (b.r - a.r) * k, a.g + (b.g - a.g) * k, a.b + (b.b - a.b) * k);
      };
      const int sky_h = 198;
      Color top = mix(Color(8, 10, 32), Color(58, 118, 188), day);
      Color horizon = mix(mix(Color(28, 24, 62), Color(140, 188, 222), day), Color(238, 132, 84), dusk * 0.8f);
      // Weather: an overcast sky turns grey, fog greyer still; a lightning flash lights it up.
      const int clouds = id(w_clouds);
      const Color grey_sky = mix(Color(26, 28, 36), Color(128, 136, 150), day);
      float overcast = clouds >= 4 ? 0.15f * clouds - 0.05f : 0.0f;  // 0.55 or 0.7
      if (id(w_fog)) overcast = 0.75f;
      top = mix(top, grey_sky, overcast);
      horizon = mix(horizon, mix(grey_sky, Color(255, 255, 255), 0.15f), overcast);
      const bool flash = id(w_storm) && ((f % 150) < 2 || ((f % 150) >= 4 && (f % 150) < 6));
      if (flash) {
        top = mix(top, Color(225, 228, 255), 0.7f);
        horizon = mix(horizon, Color(225, 228, 255), 0.7f);
      }
      auto sky_at = [&](int y) { return mix(top, horizon, (float) y / sky_h); };
      for (int y = 0; y < sky_h; y += 6) it.filled_rectangle(0, y, 172, 6, sky_at(y + 3));
      it.filled_rectangle(0, sky_h, 172, 320 - sky_h, bg);

      // Stars fade in at night and twinkle slowly.
      const float night = 1.0f - day;
      if (night > 0.3f) {
        for (int i = 0; i < 26; i++) {
          if ((int) (i % 5) < clouds || id(w_fog)) continue;  // hidden by clouds
          const uint32_t hsh = (i + 1) * 2654435761u;
          const int sx = 4 + hsh % 164;
          const int sy = 4 + (hsh >> 8) % 150;
          const float tw = 0.55f + 0.45f * sinf(t * (0.6f + (i % 5) * 0.15f) + i);
          const float k = clamp01((night - 0.3f) / 0.4f) * tw;
          const Color star = mix(sky_at(sy), Color(255, 250, 225), k);
          if (i % 6 == 0) {
            it.horizontal_line(sx - 2, sy, 5, star);
            it.vertical_line(sx, sy - 2, 5, star);
          } else {
            it.filled_rectangle(sx, sy, 2, 2, star);
          }
        }
      }

      // Crescent moon at night, top left.
      if (night > 0.5f && clouds < 5 && !id(w_fog)) {
        const Color moon = mix(sky_at(36), Color(240, 236, 205), clamp01((night - 0.5f) / 0.3f));
        it.filled_circle(30, 36, 13, moon);
        it.filled_circle(37, 31, 12, sky_at(31));
      }

      // Sun: crosses the sky from east (left) to west (right), with slowly turning rays.
      if (!std::isnan(el) && !std::isnan(az) && el > -4.0f && clouds < 4 && !id(w_fog)) {
        const int sx = 14 + (int) (clamp01((az - 90.0f) / 180.0f) * 144);
        const int sy = std::max(18, 178 - (int) (el / 60.0f * 160));
        const Color sun = mix(Color(255, 218, 92), Color(255, 150, 70), dusk);
        for (int k = 0; k < 8; k++) {
          const int ang = (int) (k * 45 + t * 8) % 360;
          it.line_at_angle(sx, sy, ang, 16, 21, sun);
        }
        it.filled_circle(sx, sy, 12, sun);
      }

      // Clouds drift from left to right, faster with wind; dark when stormy.
      if (clouds > 0) {
        const Color cloud_col = id(w_storm) ? mix(Color(40, 42, 52), Color(105, 110, 122), day)
                                            : mix(Color(58, 60, 78), Color(236, 239, 246), day);
        const float drift = id(w_wind) ? 14.0f : 3.0f;
        for (int i = 0; i < clouds + 1; i++) {
          const uint32_t hsh = (i + 7) * 2246822519u;
          const float speed_i = drift * (0.7f + (hsh % 7) * 0.1f);
          const int x = (int) fmodf(hsh % 252 + t * speed_i, 252.0f) - 40;
          const int y = 22 + i * 24 + (hsh >> 12) % 12;
          const int sz = 10 + (hsh >> 4) % 6;
          it.filled_circle(x, y, sz, cloud_col);
          it.filled_circle(x + sz, y - sz / 2, sz + 3, cloud_col);
          it.filled_circle(x + 2 * sz, y, sz, cloud_col);
          it.filled_rectangle(x, y, 2 * sz, sz, cloud_col);
        }
      }

      // Lightning bolt during a flash.
      if (flash) {
        const Color bolt(255, 250, 200);
        const int bx = 40 + (f / 150 * 53) % 90;
        int px = bx, py = 40;
        for (int k = 0; k < 5; k++) {
          const int nx = px + ((k % 2) ? -9 : 7), ny = py + 22;
          it.line(px, py, nx, ny, bolt);
          it.line(px + 1, py, nx + 1, ny, bolt);
          px = nx;
          py = ny;
        }
      }

      // Rain: thin slanted streaks; snow: slowly falling, swaying flakes.
      if (id(w_rain) > 0) {
        const Color drop = mix(Color(90, 110, 160), Color(170, 195, 235), day);
        const int n = id(w_rain) == 2 ? 44 : 24;
        const int slant = id(w_wind) ? 4 : 1;
        for (int i = 0; i < n; i++) {
          const uint32_t hsh = (i + 3) * 2654435761u;
          const int x = hsh % 172;
          const int y = (int) fmodf((hsh >> 8) % sky_h + t * 140.0f, (float) sky_h);
          if (y + 7 < sky_h) it.line(x, y, x - slant, y + 7, drop);
        }
      }
      if (id(w_snow)) {
        const Color flake(240, 244, 255);
        for (int i = 0; i < 30; i++) {
          const uint32_t hsh = (i + 11) * 2246822519u;
          const int x = (int) (hsh % 172 + 4.0f * sinf(t * 0.8f + i));
          const int y = (int) fmodf((hsh >> 8) % sky_h + t * 18.0f, (float) sky_h);
          if (y + 2 < sky_h) it.filled_rectangle(x, y, 2, 2, flake);
        }
      }

      // Body: breathes (a bit faster when the air is bad), bobs, shivers gently when cold.
      const float speed = id(breath_speed);
      const int r = 56 + (int) (3.0f * sinf(t * speed));
      int cx = 86 + (cold ? (((f / 3) % 2) ? 1 : -1) : 0);
      const int cy = 112 + (int) (4.0f * sinf(t * 0.7f));

      // Shadow on the ground: a flat ellipse, smaller when the character floats up.
      const Color shade = mix(sky_at(186), Color(0, 0, 0), 0.45f);
      const float bob = (cy - 112) / 4.0f;  // -1 (up) to 1 (down)
      const float sa = 40.0f + 6.0f * bob;  // half width
      const float sb = 5.0f + 1.0f * bob;   // half height
      for (int yy = (int) -sb; yy <= (int) sb; yy++) {
        const float k = 1.0f - (yy * yy) / (sb * sb);
        const int hw = (int) (sa * sqrtf(k > 0 ? k : 0));
        if (hw > 0) it.horizontal_line(86 - hw, 186 + yy, 2 * hw + 1, shade);
      }

      it.filled_circle(cx, cy, r, body);
      // Little sprout on top.
      const int sway = (int) (4.0f * sinf(t * 1.3f));
      it.line(cx, cy - r, cx + sway, cy - r - 14, Color(90, 170, 110));
      it.line(cx + 1, cy - r, cx + 1 + sway, cy - r - 14, Color(90, 170, 110));
      it.filled_circle(cx + sway + 5, cy - r - 15, 5, Color(110, 200, 120));
      it.filled_circle(cx + sway - 4, cy - r - 13, 4, Color(110, 200, 120));

      // Eyes: blink for 2 frames every ~4 s; look around slowly.
      const bool blink = (f % 50) < 2;
      const int look = (int) (3.0f * sinf(t * 0.5f));
      const int ey = cy - 10;
      for (int side = -1; side <= 1; side += 2) {
        const int ex = cx + side * 20;
        if (blink || mood == -1) {
          it.filled_rectangle(ex - 8, ey, 16, 3, ink);
        } else if (mood == 2) {
          // Dizzy "x" eyes.
          it.line(ex - 6, ey - 6, ex + 6, ey + 6, ink);
          it.line(ex - 6, ey + 6, ex + 6, ey - 6, ink);
          it.line(ex - 5, ey - 6, ex + 7, ey + 6, ink);
          it.line(ex - 5, ey + 6, ex + 7, ey - 6, ink);
        } else {
          it.filled_circle(ex, ey, 9, white);
          it.filled_circle(ex + look, ey + 1, 5, ink);
          it.filled_circle(ex + look + 2, ey - 2, 2, white);
        }
      }

      // Cheeks when happy.
      if (mood == 0) {
        it.filled_circle(cx - 34, cy + 8, 7, Color(250, 150, 160));
        it.filled_circle(cx + 34, cy + 8, 7, Color(250, 150, 160));
      }

      // Mouth.
      const int my = cy + 16;
      if (mood == 0) {
        // Smile: lower half of a ring.
        for (int a = 20; a <= 160; a += 4) {
          const float rad = a * 3.14159f / 180.0f;
          it.filled_circle(cx + (int) (12 * cosf(rad)), my - 4 + (int) (8 * sinf(rad)), 2, ink);
        }
      } else if (mood == 1) {
        it.filled_rectangle(cx - 9, my, 18, 3, ink);
      } else if (mood == 2) {
        // Gasping mouth, opening and closing.
        const int o = 5 + (int) (3.0f * fabsf(sinf(t * 2.4f)));
        it.filled_circle(cx, my + 2, o, ink);
      } else {
        it.filled_circle(cx, my, 2, ink);
      }

      // Sweat drop when hot or suffocating.
      if (hot || mood == 2) {
        const int dy = (int) (f % 30);
        const Color drop(120, 190, 255);
        it.filled_circle(cx + r - 6, cy - 30 + dy, 4, drop);
        it.filled_triangle(cx + r - 10, cy - 31 + dy, cx + r - 2, cy - 31 + dy, cx + r - 6, cy - 39 + dy, drop);
      }

      // Floating "z" bubbles while waiting for data.
